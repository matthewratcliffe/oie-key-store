name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin
        env:
          PLUGIN_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.1.0' }}
        run: |
          chmod +x build.sh
          export PLUGIN_VERSION="${PLUGIN_VERSION#v}"
          ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: oie-key-store
          path: dist/*.zip
          if-no-files-found: error
      - name: Publish release ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true

